<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Five orchestration sub-decisions</title>
  <desc id="desc">The O1 to O5 orchestration decision chain: spawn, delegate, communicate, aggregate, and stop. O5 stopping is highlighted as uncovered by explicit training methods in the curated pool.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="980" height="430" rx="22" fill="#f8fafc"/>
  <rect x="38" y="34" width="904" height="348" rx="20" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="68" y="75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0f172a">Five orchestration sub-decisions</text>
  <text x="68" y="103" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Surveyed entries cover O1-O4; explicit learned stopping remains an open cell.</text>

  <g stroke="#475569" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <line x1="213" y1="182" x2="255" y2="182"/>
    <line x1="367" y1="182" x2="409" y2="182"/>
    <line x1="521" y1="182" x2="563" y2="182"/>
    <line x1="675" y1="182" x2="717" y2="182"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="101" y="132" width="112" height="100" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2.2"/>
    <rect x="255" y="132" width="112" height="100" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="2.2"/>
    <rect x="409" y="132" width="112" height="100" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2"/>
    <rect x="563" y="132" width="112" height="100" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2.2"/>
    <rect x="717" y="132" width="112" height="100" rx="14" fill="#dbeafe" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 6"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="157" y="162" font-size="18" font-weight="900" fill="#991b1b">O1</text>
    <text x="157" y="186" font-size="14" font-weight="800" fill="#0f172a">when to</text>
    <text x="157" y="207" font-size="15" font-weight="900" fill="#0f172a">spawn</text>

    <text x="311" y="162" font-size="18" font-weight="900" fill="#9a3412">O2</text>
    <text x="311" y="186" font-size="14" font-weight="800" fill="#0f172a">whom to</text>
    <text x="311" y="207" font-size="15" font-weight="900" fill="#0f172a">delegate</text>

    <text x="465" y="162" font-size="18" font-weight="900" fill="#854d0e">O3</text>
    <text x="465" y="186" font-size="14" font-weight="800" fill="#0f172a">how to</text>
    <text x="465" y="207" font-size="15" font-weight="900" fill="#0f172a">communicate</text>

    <text x="619" y="162" font-size="18" font-weight="900" fill="#166534">O4</text>
    <text x="619" y="186" font-size="14" font-weight="800" fill="#0f172a">how to</text>
    <text x="619" y="207" font-size="15" font-weight="900" fill="#0f172a">aggregate</text>

    <text x="773" y="162" font-size="18" font-weight="900" fill="#1d4ed8">O5</text>
    <text x="773" y="186" font-size="14" font-weight="800" fill="#0f172a">when to</text>
    <text x="773" y="207" font-size="15" font-weight="900" fill="#0f172a">stop</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="157" y="267">Kimi PARL</text>
    <text x="157" y="284">AgentSpawn</text>
    <text x="157" y="301">HALO</text>

    <text x="311" y="267">Puppeteer</text>
    <text x="311" y="284">ParaManager</text>

    <text x="465" y="267">Debate-as-Reward</text>
    <text x="465" y="284">LatentMAS</text>

    <text x="619" y="267">M-GRPO</text>
    <text x="619" y="284">Context-Folding</text>

    <text x="773" y="267" font-weight="900" fill="#dc2626">no published</text>
    <text x="773" y="284" font-weight="900" fill="#dc2626">training method</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#334155">
    <rect x="84" y="325" width="812" height="36" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="490" y="348" font-size="13" text-anchor="middle">
      O5 is usually externally signaled or fixed by a step cap, rather than explicitly trained as a stopping policy.
    </text>
  </g>
</svg>
