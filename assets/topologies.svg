<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Six recurring LLM-MAS topologies</title>
  <desc id="desc">Visual schematics of six recurring LLM-based multi-agent-system topologies: centralized, planner-executor-critic, debate, parallel swarm, hierarchical, and managed harness-based.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="980" height="680" rx="22" fill="#f8fafc"/>
  <text x="50" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0f172a">Six recurring LLM-MAS topologies</text>
  <text x="50" y="87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">Topology constrains which reward and credit units are easiest to define.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="40" y="118" width="282" height="220" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="349" y="118" width="282" height="220" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="658" y="118" width="282" height="220" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="40" y="382" width="282" height="220" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="349" y="382" width="282" height="220" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
    <rect x="658" y="382" width="282" height="220" rx="16" fill="#ffffff" stroke="#dbe3ef"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#0f172a">
    <text x="181" y="314" text-anchor="middle">(a) centralized</text>
    <text x="490" y="314" text-anchor="middle">(b) planner-executor-critic</text>
    <text x="799" y="314" text-anchor="middle">(c) debate / committee</text>
    <text x="181" y="578" text-anchor="middle">(d) parallel swarm</text>
    <text x="490" y="578" text-anchor="middle">(e) hierarchical</text>
    <text x="799" y="578" text-anchor="middle">(f) managed / harness-based</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="181" y="333">Kimi PARL, M-GRPO, Puppeteer</text>
    <text x="490" y="333">MALT, MATPO, MAE</text>
    <text x="799" y="333">Debate-as-Reward, LatentMAS</text>
    <text x="181" y="597">Kimi K2.5/K2.6, parallel Claudes</text>
    <text x="490" y="597">HALO, AgentSpawn, DEPART</text>
    <text x="799" y="597">Codex, Claude Code, Agent Lightning</text>
  </g>

