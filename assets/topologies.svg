    <text x="799" y="431" font-size="11" fill="#475569">managed harness</text>
    <circle cx="799" cy="448" r="25" fill="#fee2e2" stroke="#ef4444" stroke-width="2.4"/>
    <text x="799" y="453" font-size="14" fill="#991b1b">O</text>
    <circle cx="740" cy="515" r="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
